<div class="container">
  <div class="todo-card">

    <h2>{{ title }}</h2>

    <div class="input-section">
      <input
        type="text"
        placeholder="Enter task"
        [(ngModel)]="taskName">
      <button (click)="addTask()">Add</button>
    </div>

    <ul>
      <li *ngFor="let task of tasks; let i = index">

        <!-- ngIf directive -->
        <p *ngIf="!task.done">Task Pending</p>
        <p *ngIf="task.done">Task Completed</p>

        <!-- ngClass directive -->
        <p [ngClass]="{completed: task.done}">
          {{ task.name }}
        </p>

        <!-- ngStyle directive -->
        <p [ngStyle]="{color: task.done ? 'green' : 'red'}">
          Status : {{ task.done ? 'Done' : 'Not Done' }}
        </p>

        <button *ngIf="!task.done"
                class="done"
                (click)="markDone(task)">
          Mark Done
        </button>

        <button class="delete"
                (click)="deleteTask(i)">
          Delete
        </button>

      </li>
    </ul>

  </div>
</div>
