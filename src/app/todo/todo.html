<div class="container" [class.dark]="darkMode()">
  <div class="todo-card">

    <header class="todo-header">
      <h2>{{ title }}</h2>
      <button type="button" class="theme-toggle" (click)="toggleTheme()" [attr.aria-pressed]="darkMode()"
        aria-label="Toggle dark mode">
        {{ darkMode() ? '☀️' : '🌙' }}
      </button>
    </header>

    <form class="input-section" (ngSubmit)="addTask()">
      <input type="text" name="taskName" placeholder="What needs to be done?" [attr.maxlength]="maxTaskLength"
        [(ngModel)]="taskName" aria-label="New task name">
      <button type="submit">Add</button>
    </form>
    <p class="error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="filters" role="tablist" aria-label="Filter tasks">
      <button type="button" [class.active]="filter() === 'all'" (click)="setFilter('all')">
        All ({{ tasks().length }})
      </button>
      <button type="button" [class.active]="filter() === 'active'" (click)="setFilter('active')">
        Active ({{ remainingCount() }})
      </button>
      <button type="button" [class.active]="filter() === 'done'" (click)="setFilter('done')">
        Done ({{ doneCount() }})
      </button>
    </div>

    <ul>
      <li *ngFor="let task of filteredTasks(); trackBy: trackByTaskId">

        <div class="task-content">
          <!-- Task Name -->
          <p [class.completed]="task.done" *ngIf="!task.editing">
            {{ task.name }}
          </p>
          <input *ngIf="task.editing" [(ngModel)]="editDraft" [attr.maxlength]="maxTaskLength"
            (keyup.enter)="saveTask(task)" (keyup.escape)="cancelEdit(task)"
            [attr.aria-label]="'Edit task: ' + task.name" />

          <!-- Status -->
          <p class="status" [class.status-done]="task.done" [class.status-pending]="!task.done">
            {{ task.done ? 'Done' : 'Not Done' }}
          </p>
        </div>

        <div class="task-actions">
          <button *ngIf="!task.editing" class="done" (click)="toggleDone(task)" [attr.aria-pressed]="task.done">
            {{ task.done ? 'Undo' : 'Done' }}
          </button>
          <button *ngIf="!task.editing" class="edit" (click)="editTask(task)">
            Edit
          </button>
          <ng-container *ngIf="task.editing">
            <button class="save" (click)="saveTask(task)">Save</button>
            <button class="cancel" (click)="cancelEdit(task)">Cancel</button>
          </ng-container>
          <button class="delete" (click)="deleteTask(task)" aria-label="Delete task">
            Delete
          </button>
        </div>

      </li>

      <li class="empty-state" *ngIf="filteredTasks().length === 0">
        <span>{{ tasks().length === 0 ? 'No tasks yet — add your first one above.' : 'Nothing here for this filter.'
          }}</span>
      </li>
    </ul>

    <footer class="todo-footer" *ngIf="doneCount() > 0">
      <button type="button" class="clear-completed" (click)="clearCompleted()">
        Clear completed ({{ doneCount() }})
      </button>
    </footer>

  </div>
</div>
